[workspace]
authors = ["WiLoR contributors"]
channels = ["conda-forge"]
name = "wilor"
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
pip = "*"

[pypi-dependencies]
torch = ">=2.0,<=2.5"
torchvision = ">=0.15.1"
numpy = ">=1.22,<2"
opencv-python = "*"
pyrender = "*"
pytorch-lightning = "*"
scikit-image = "*"
smplx = "==0.1.28"
yacs = "*"
chumpy = { git = "https://github.com/mattloper/chumpy" }
timm = "*"
einops = "*"
xtcocotools = "*"
pandas = "*"
hydra-core = "*"
hydra-submitit-launcher = "*"
hydra-colorlog = "*"
pyrootutils = "*"
rich = "*"
webdataset = "*"
gradio = "*"
ultralytics = "==8.1.34"
pyrealsense2 = "*"

[tasks]
realsense = { cmd = "python demo_realsense.py", env = { PYTHONPATH = "" } }
